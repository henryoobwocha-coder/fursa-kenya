  <!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Fursa Kenya</title>
<style>body{font-family:Arial;margin:0;background:#f4f7f6}header{background:#0a7a42;color:white;padding:20px;text-align:center}.container{max-width:900px;margin:20px auto;padding:15px}.card{background:white;padding:20px;border-radius:10px;margin-bottom:15px;box-shadow:0 2px 5px #0001}.op{border:1px solid #ddd;padding:15px;margin:10px 0;border-radius:8px}.btn{background:#0a7a42;color:white;padding:8px 15px;border-radius:5px;text-decoration:none;display:inline-block}</style>
</head><body>
<header><h1>Fursa Kenya</h1><p>Discover scholarships and opportunities</p></header>
<div class="container"><div class="card"><div id="list">Loading opportunities...</div><div id="debug" style="color:red;margin-top:10px"></div></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.43.4/dist/umd/supabase.min.js"></script>
<script>
const url = "https://wqhbenevvvfpkvaesgga.supabase.co"
const key = "sb_publishable_SUy6r6GTnmptIaOlXZ_YWQ_juvQ7plf"
const client = supabase.createClient(url, key)

async function load(){
  try{
    document.getElementById('debug').innerText = "Connecting to Supabase... URL: "+url;
    // Try both possible table names
    let tablesToTry = ['opportunities','opportunities','scholarships'];
    let data = null; let lastError = null;
    for(let t of tablesToTry){
      let res = await client.from(t).select('*').limit(20);
      if(!res.error){ data = res.data; document.getElementById('debug').innerText = "Success! Table found: "+t+" with "+res.data.length+" rows"; break; }
      else { lastError = res.error.message + " (table "+t+")"; }
    }
    if(!data){
      document.getElementById('list').innerHTML = "Error loading";
      document.getElementById('debug').innerText = "FAILED: "+lastError+" . Check Table Editor - what is your table name? Is it empty?";
      return;
    }
    if(data.length===0){
      document.getElementById('list').innerHTML = "Table is empty - Add rows in Supabase Table Editor";
      return;
    }
    let html="";
    data.forEach(o=>{
      html+=`<div class="op"><h3>${o.title||'No Title'}</h3><p>${o.description||''}</p><small>Deadline: ${o.deadline||'Open'}</small><br><br><a href="${o.link||'#'}" target="_blank" class="btn">Apply Now</a></div>`
    })
    document.getElementById('list').innerHTML=html;
  }catch(e){
    document.getElementById('debug').innerText="JS Error: "+e.message
  }
}
load()
</script>
</body></html>
