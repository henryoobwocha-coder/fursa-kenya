<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fursa Kenya</title>
<style>body{font-family:Arial;margin:0;background:#f0f4f0}header{background:#0a7a42;color:white;padding:25px;text-align:center}.container{max-width:900px;margin:auto;padding:15px}.card{background:white;padding:20px;border-radius:10px;margin-bottom:15px;box-shadow:0 2px 8px #0002}.opp{border-left:5px solid #0a7a42;padding:15px;margin:12px 0;background:#fff;border-radius:8px}.btn{background:#0a7a42;color:white;padding:10px 18px;text-decoration:none;border-radius:6px;display:inline-block;font-weight:bold}</style>
</head><body>
<header><h1>FURSA OPPORTUNITIES FOUNDATION</h1><p>Live Scholarships from Database</p></header>
<div class="container">
<div class="card"><h3>✅ Website is LIVE - Connected to Supabase</h3><p>Total Opportunities in DB: <span id="count">...</span></p></div>
<div id="list">Loading via Direct API...</div>
<div id="error" style="color:red;white-space:pre-wrap;margin-top:15px;background:#ffe6e6;padding:10px;border-radius:8px;display:none"></div>
</div>
<script>
async function load(){
  const url = "https://wqhbenevvvfpkvaesgga.supabase.co/rest/v1/opportunities?select=*&order=created_at.desc&limit=20";
  const key = "sb_publishable_SUy6r6GTnmptIaOlXZ_YWQ_juvQ7plf";
  try{
    let res = await fetch(url, { headers: { "apikey": key, "Authorization": "Bearer "+key } });
    let text = await res.text();
    if(!res.ok){
      document.getElementById('error').style.display='block';
      document.getElementById('error').innerText = "API Error "+res.status+": "+text+"\n\nRun in Supabase SQL:\nALTER TABLE public.opportunities DISABLE ROW LEVEL SECURITY;";
      document.getElementById('list').innerText="Failed - see red error below";
      return;
    }
    let data = JSON.parse(text);
    document.getElementById('count').innerText = data.length;
    if(data.length==0){ document.getElementById('list').innerText="No data in table"; return; }
    let html="";
    data.forEach(o=>{
      html+=`<div class="opp"><h3 style="margin:0 0 8px 0;color:#0a7a42">${o.title||'Untitled'}</h3><p>${(o.description||'').substring(0,200)}</p><p><small><b>Deadline:</b> ${o.deadline||'Open'} | <b>Type:</b> ${o.type||'Scholarship'}</small></p><a class="btn" href="${o.link||'#'}" target="_blank">Apply Now</a></div>`;
    });
    document.getElementById('list').innerHTML=html;
  }catch(e){
    document.getElementById('error').style.display='block';
    document.getElementById('error').innerText="Network Error: "+e.message;
  }
}
load();
</script>
</body></html>
