<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Fursa Kenya</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7f6;
      color: #17201b;
    }

    header {
      background: #087f5b;
      color: white;
      padding: 30px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 34px;
    }

    header p {
      margin: 8px 0 0;
      font-size: 17px;
    }

    .container {
      max-width: 1000px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .search {
      width: 100%;
      box-sizing: border-box;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
      margin-bottom: 25px;
    }

    .card {
      background: white;
      padding: 22px;
      margin-bottom: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .card h2 {
      margin-top: 0;
      color: #087f5b;
    }

    .card p {
      line-height: 1.6;
    }

    .verified {
      display: inline-block;
      background: #e8f7f1;
      color: #087f5b;
      padding: 6px 10px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 13px;
      margin-bottom: 12px;
    }

    .apply-button {
      display: inline-block;
      background: #087f5b;
      color: white;
      padding: 12px 20px;
      border-radius: 7px;
      text-decoration: none;
      font-weight: bold;
      margin-top: 10px;
    }

    .apply-button:hover {
      opacity: 0.9;
    }

    .message {
      text-align: center;
      padding: 30px;
    }
  </style>
</head>

<body>

<header>
  <h1>Fursa Kenya</h1>
  <p>Discover scholarships and opportunities for Kenyans</p>
</header>

<div class="container">

  <input
    id="search"
    class="search"
    type="text"
    placeholder="Search scholarships and opportunities..."
  >

  <div id="opportunities">
    <div class="message">Loading opportunities...</div>
  </div>

</div>

<script>

  const SUPABASE_URL = "https://wqhbenevvvfpkvaesgga.supabase.co";

  const SUPABASE_ANON_KEY = "sb_publishable_SUy6r6GTnmptIaOlXZ_YWQ_juvQ7plf";

  const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );

  let allOpportunities = [];

  async function loadOpportunities() {

    const { data, error } = await supabaseClient
      .from("opportunities")
      .select("*")
      .eq("is_active", true)
      .order("created_at", { ascending: false });

    const container = document.getElementById("opportunities");

    if (error) {
      console.error(error);

      container.innerHTML =
        '<div class="message">Unable to load opportunities.</div>';

      return;
    }

    allOpportunities = data || [];

    displayOpportunities(allOpportunities);
  }


  function displayOpportunities(opportunities) {

    const container = document.getElementById("opportunities");

    if (!opportunities.length) {

      container.innerHTML =
        '<div class="message">No opportunities found.</div>';

      return;
    }


    container.innerHTML = opportunities.map(item => `

      <div class="card">

        ${
          item.is_verified === true
            ? '<div class="verified">✅ SOURCE VERIFIED</div>'
            : ''
        }

        <h2>${item.title || "Opportunity"}</h2>

        <p>
          <strong>🏢 Organization:</strong>
          ${item.organization || "Not specified"}
        </p>

        <p>
          <strong>📅 Deadline:</strong>
          ${item.date || "Not specified"}
        </p>

        <p>
          <strong>💰 Funding:</strong>
          ${item.amount || "See official details"}
        </p>

        <p>
          <strong>👥 Eligibility:</strong>
          ${item.eligibility || "See official requirements"}
        </p>

        <p>
          <strong>🌍 Country:</strong>
          ${item.country || "Not specified"}
        </p>

        <p>
          <strong>📝 Description:</strong><br>
          ${item.description || "No description available."}
        </p>

        ${
          item.application_url
            ? `
              <a
                class="apply-button"
                href="${item.application_url}"
                target="_blank"
                rel="noopener noreferrer"
              >
                🔗 Apply Now
              </a>
            `
            : ''
        }

      </div>

    `).join("");
  }


  document
    .getElementById("search")
    .addEventListener("input", function () {

      const searchText = this.value.toLowerCase();

      const filtered = allOpportunities.filter(item =>
        JSON.stringify(item)
          .toLowerCase()
          .includes(searchText)
      );

      displayOpportunities(filtered);

    });


  loadOpportunities();

</script>

</body>
</html>
